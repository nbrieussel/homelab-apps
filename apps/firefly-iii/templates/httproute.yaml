apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: firefly-iii
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: https
  hostnames:
    - {{ include "firefly.host" . }}
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          # Naming rule: see "firefly.service" in _helpers.tpl.
          name: {{ include "firefly.service" . }}
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
