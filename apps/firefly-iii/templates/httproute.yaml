apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: firefly-iii
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: https
  hostnames:
    - {{ printf "%s%s.%s" .Values.hostPrefix .Values.hostSuffix .Values.domain }}
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          # Same naming rule as the upstream chart's fullname helper: the
          # release name if it already contains the chart name (the real
          # instance, release `firefly-iii`), else <release>-firefly-iii
          # (previews, release `firefly-pr-<N>`).
          name: {{ if contains "firefly-iii" .Release.Name }}{{ .Release.Name }}{{ else }}{{ .Release.Name }}-firefly-iii{{ end }}
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
