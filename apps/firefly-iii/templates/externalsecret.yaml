# APP_KEY (Laravel encryption key: losing it makes stored data unreadable)
# and the DB password. Both are Terraform-managed in OpenBao; no value ever
# lives in this public repo.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretName }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range $pair := list (list "APP_KEY" "app-key") (list "DB_PASSWORD" "db-password") }}
    - secretKey: {{ index $pair 0 }}
      remoteRef:
        key: {{ $.Values.openbaoPath }}
        property: {{ index $pair 1 }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    {{- end }}
