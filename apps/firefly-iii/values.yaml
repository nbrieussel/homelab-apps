# Values consumed by this chart's own templates.
namespace: firefly-iii
domain: staging.scalepack.fr
hostPrefix: firefly
# Overridden per cluster by the infra repo when it sets a host suffix.
hostSuffix: ""

gateway:
  name: scaleway-gateway
  namespace: gateway

clusterSecretStoreName: openbao
secretName: firefly-credentials
# kv/apps/firefly/credentials, declared in the infra repo's
# 11-secrets/openbao/managed. Keys: app-key, db-password.
openbaoPath: apps/firefly/credentials

# true for ephemeral PR previews: the chart then owns its Namespace, so
# deleting the Application removes the namespace too.
ownNamespace: false

# Platform SSO: authentik's forward-auth in front of Firefly, and Firefly signing
# the user in from the identity header it sets (templates/sso.yaml explains the
# trust model). OFF here on purpose: previews share this file and are not behind
# authentik, so they keep Firefly's own login. The real instance turns it on from
# bootstrap/values.yaml, together with the two Firefly settings it needs
#   firefly-iii.config.env.AUTHENTICATION_GUARD=remote_user_guard
#   firefly-iii.config.env.AUTHENTICATION_GUARD_HEADER=HTTP_X_AUTHENTIK_EMAIL
# (the chart refuses to render the guard without sso.enabled).
sso:
  enabled: false
  # authentik's in-cluster Service, referenced directly so the check never
  # depends on external DNS or the Gateway.
  authentikServiceName: authentik-server
  authentikServiceNamespace: authentik
  authentikServicePort: 80

postgres:
  # What happens to the DB volume when the StatefulSet is deleted. Retain for
  # the real instance; previews set Delete (else every closed PR leaks a PVC).
  pvcRetention: Retain
  image: postgres:17-alpine
  storage: 2Gi
  database: firefly
  user: firefly

# Upstream chart values (nested under the dependency name).
firefly-iii:
  # One replica on a ReadWriteOnce volume: the default RollingUpdate starts the new
  # pod BEFORE stopping the old one, the new pod can land on another node, and
  # then it waits forever for a volume the old pod still holds (seen live: the
  # first config change after deploy stuck in ContainerCreating, "Volume is
  # already used by pod(s) ..."). Recreate stops the old pod first.
  deploymentStrategyType: Recreate
  config:
    existingSecret: firefly-credentials
    env:
      DB_HOST: firefly-db
      DB_CONNECTION: pgsql
      DB_PORT: "5432"
      DB_DATABASE: firefly
      DB_USERNAME: firefly
      TZ: Europe/Paris
      DEFAULT_LANGUAGE: fr_FR
      DEFAULT_LOCALE: equal
      TRUSTED_PROXIES: "**"
      APP_URL: https://firefly.staging.scalepack.fr
  # Credentials come from existingSecret, never from this file.
  # The upstream chart always renders an app-key Secret and has no opt-out;
  # a fixed placeholder keeps it deterministic (a random one would show as
  # permanent drift in ArgoCD). It is NOT the real key: config.existingSecret
  # is listed after it in envFrom and overrides APP_KEY.
  secrets:
    env: {}
    appKey: "placeholder-overridden-by-secret"
  persistence:
    enabled: true
    storage: 1Gi
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 512Mi}
