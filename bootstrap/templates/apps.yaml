{{- range $app := .Values.apps }}
{{- /* An entry takes its chart from this repo, or from the platform's gitops repo
(`source: gitops`: a generic platform chart such as velero-pvc-restore, configured
with `valuesObject`). */ -}}
{{- $repoURL := $.Values.repoURL }}
{{- $revision := $.Values.revision }}
{{- if eq (.source | default "") "gitops" }}
{{- $repoURL = $.Values.gitops.repoURL }}
{{- $revision = $.Values.gitops.revision }}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .name }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: {{ .wave | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ $repoURL }}
    targetRevision: {{ $revision }}
    path: {{ .chartPath }}
    helm:
      {{- if .valueFile }}
      valueFiles:
        - {{ .valueFile }}
      {{- end }}
      {{- if .valuesObject }}
      valuesObject:
        {{- toYaml .valuesObject | nindent 8 }}
      {{- end }}
      {{- if .parameters }}
      # Free-form extra Helm parameters for this entry ({name, value}), same
      # convention as IntegratedDynamic/gitops's bootstrap chart. forceString so
      # "true" stays a string instead of being typed as a boolean.
      parameters:
        {{- range .parameters }}
        - name: {{ .name }}
          value: {{ .value | quote }}
          forceString: true
        {{- end }}
      {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
{{- end }}
