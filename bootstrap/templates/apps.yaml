{{- range $app := .Values.apps }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .name }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: {{ .wave | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ $.Values.repoURL }}
    targetRevision: {{ $.Values.revision }}
    path: {{ .chartPath }}
    helm:
      valueFiles:
        - {{ .valueFile }}
      {{- if .parameters }}
      # Free-form extra Helm parameters for this entry ({name, value}), same
      # convention as IntegratedDynamic/gitops's bootstrap chart. forceString so
      # "true" stays a string instead of being typed as a boolean.
      parameters:
        {{- range .parameters }}
        - name: {{ .name }}
          value: {{ .value | quote }}
          forceString: true
        {{- end }}
      {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
{{- end }}
